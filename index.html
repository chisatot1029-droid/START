<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>スターと（縦スクロール版 プロトタイプ）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 画面は iPad Pro 11インチ よこ置き（1194×834）と同じ比率 -->
  <div id="screen">
    <canvas id="canvas" width="1194" height="834"></canvas>

    <div id="fade"></div>

    <div id="dialog" class="hidden">
      <div id="speaker"></div>
      <img id="face" class="hidden" alt="">
      <div id="text"></div>
      <div id="choices"></div>
      <div id="nextMark">▶</div>
    </div>

    <div id="title" class="overlay">
      <div id="menu">
        <button id="startBtn" class="menuBtn">スタート</button>
        <button id="settingBtn" class="menuBtn">セッティング</button>
        <button id="autoBtn" class="menuBtn">オートで みる</button>
      </div>
      <p class="howto">↑ ↓ ← → キー・ゆびで なぞる：あるく　／　クリック・タップ・Enter：すすむ・えらぶ</p>
    </div>

    <div id="ending" class="overlay hidden">
      <p class="endTitle">つづく</p>
      <p id="endText"></p>
      <button id="againBtn" class="menuBtn small">タイトルへ</button>
    </div>

    <div id="toast"></div>

    <!-- オートモード：うごいている カーソル -->
    <div id="autoBadge" class="hidden">AUTO（Esc・クリックで やめる）</div>
    <div id="cursor" class="hidden">
      <div id="cursorRing"></div>
      <svg viewBox="0 0 24 36" aria-hidden="true">
        <path d="M2 2 L2 28 L9 21.5 L13.5 32 L18 30 L13.5 19.5 L22.5 19.5 Z"
              fill="#fff" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <script src="js/story.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
